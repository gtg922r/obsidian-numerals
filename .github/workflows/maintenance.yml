name: Stable maintenance checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify stable metadata and source
        run: node scripts/check-stable-maintenance.mjs
      - run: npm ci
      - run: npm run lint
      - name: Typecheck production
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Typecheck tests and mocks
        run: ./node_modules/.bin/tsc --project tsconfig.test.json
      - name: Typecheck scripts
        run: ./node_modules/.bin/tsc --project tsconfig.scripts.json
      - run: npm test -- --runInBand
      - name: Verify maintenance guards
        run: node --test tests/maintenance/*.test.mjs
      - run: npm run build
      - run: npm run symbols:check
      - name: Verify reproducible bundle
        run: node scripts/check-reproducible-build.mjs
      - name: Recheck stable metadata and source
        if: always()
        run: node scripts/check-stable-maintenance.mjs
