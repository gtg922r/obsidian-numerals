name: Stable publication disabled

on:
  push:
    tags: ["*"]

permissions: {}

jobs:
  publication-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse publication from stable maintenance
        run: |
          echo "::error::Publication from stable maintenance is disabled. The owner must use the reviewed chore/recovery-1.11 workflow for BRAT prereleases. Stable remains 1.10.2; production promotion is prohibited."
          exit 1
